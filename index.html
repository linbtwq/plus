<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>++.++</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob ruby"></div>
        <div class="blob dark"></div>
    </div>
    
    <div class="wrapper center-screen">
        <div class="main-menu glass-panel auth-card">
            <h1 class="main-title">++<span class="accent">.</span>++</h1>
            
            <div id="login-section">
                <button id="login-btn" class="btn-primary">ВОЙТИ ЧЕРЕЗ GOOGLE</button>
            </div>

            <div id="app-menu" style="display: none;">
                <div class="user-info">
                    <img id="user-avatar" referrerpolicy="no-referrer" class="avatar-img">
                    <div id="user-name" class="user-name-text"></div>
                    <button id="logout-btn" class="logout-link">ВЫЙТИ</button>
                </div>
                
                <div class="menu-actions">
                    <a href="rate.html" class="btn-primary">ОЦЕНИТЬ ФИЛЬМ</a>
                    <a href="list.html" class="btn-secondary">ЛЕНТА ФИЛЬМОВ</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, provider, signInWithPopup, signOut, onAuthStateChanged } from './firebase-init.js';
        onAuthStateChanged(auth, (user) => {
            document.getElementById('login-section').style.display = user ? 'none' : 'block';
            document.getElementById('app-menu').style.display = user ? 'block' : 'none';
            if (user) {
                document.getElementById('user-name').textContent = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
            }
        });
        document.getElementById('login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
