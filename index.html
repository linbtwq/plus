<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8"><title>++.++</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blobs">
    <div class="blob ruby"></div>
    <div class="blob dark"></div>
</div>
    <div class="interactive-bg">
        <div class="aurora-blob ruby"></div>
        <div class="aurora-blob dark"></div>
    </div>
    
    <div class="wrapper center-screen">
        <div class="main-menu glass-panel" style="padding: 50px 40px; text-align: center; width: 100%; max-width: 420px;">
            <h1 class="main-title" style="font-size: 2.5rem;">++<span class="accent">.</span>++</h1>
            
            <div id="login-section">
                <button id="login-btn" class="btn-primary">ВОЙТИ ЧЕРЕЗ GOOGLE</button>
            </div>

            <div id="app-menu" style="display: none;">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 35px;">
                    <img id="user-avatar" referrerpolicy="no-referrer" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); object-fit: cover;">
                    <div id="user-name" style="font-family: 'Unbounded'; font-size: 0.9rem;"></div>
                    <button id="logout-btn" style="background: none; border: none; color: #888; font-family: 'Unbounded'; font-size: 0.65rem; cursor: pointer; text-decoration: underline;">ВЫЙТИ</button>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <a href="rate.html" class="btn-primary">ОЦЕНИТЬ ФИЛЬМ</a>
                    <a href="list.html" class="btn-secondary">ЛЕНТА ФИЛЬМОВ</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, provider, signInWithPopup, signOut, onAuthStateChanged } from './firebase-init.js';
        onAuthStateChanged(auth, (user) => {
            document.getElementById('login-section').style.display = user ? 'none' : 'block';
            document.getElementById('app-menu').style.display = user ? 'block' : 'none';
            if (user) {
                document.getElementById('user-name').textContent = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
            }
        });
        document.getElementById('login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
    
    <script>
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2; // от -1 до 1
            const y = (e.clientY / window.innerHeight - 0.5) * 2; // от -1 до 1
            document.body.style.setProperty('--mouse-x', x);
            document.body.style.setProperty('--mouse-y', y);
        });
    </script>
</body>
</html>
